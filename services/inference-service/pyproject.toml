[project]
name = "byb-inference-service"
version = "0.1.0"
description = "Buy You Before - vLLM product understanding for the room simulator"
authors = [{ name = "Hassaan", email = "hassaan@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "byb_inference", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic-settings = ">=2.3.0"
httpx = ">=0.27.0"
byb-common = { path = "../../libs/byb-common", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
ruff = ">=0.6.0"

[project.scripts]
start = "byb_inference.main:start"
dev = "byb_inference.main:dev"
test = "pytest:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
