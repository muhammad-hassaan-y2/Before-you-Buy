[project]
name = "byb-vision-service"
version = "0.1.0"
description = "Buy You Before - room photo measurement for the room simulator"
authors = [{ name = "Hassaan", email = "hassaan@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "byb_vision", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic-settings = ">=2.3.0"
httpx = ">=0.27.0"
numpy = ">=1.26.0"
opencv-python-headless = ">=4.10,<5"
byb-common = { path = "../../libs/byb-common", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
ruff = ">=0.6.0"

[project.scripts]
start = "byb_vision.main:start"
dev = "byb_vision.main:dev"
test = "pytest:main"

[tool.pytest.ini_options]
# Windows: a stale, unreadable %TEMP%\pytest-of-<user> makes the tmp_path fixture fail.
addopts = "--basetemp=.pytest-tmp"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
