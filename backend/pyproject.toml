[project]
name = "backend"
version = "0.1.0"
description = "Buy you Before - Room Simulator Backend"
authors = [
    {name = "Hassaan", email = "hassaan@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.6",
    "shapely>=2.0.1",
    "pydantic-settings>=2.0.0"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[tool.poetry.scripts]
start = "backend.main:start"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
