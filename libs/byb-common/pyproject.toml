[project]
name = "byb-common"
version = "0.1.0"
description = "Shared event contracts and Dapr transport helpers for Before You Buy services"
authors = [{ name = "Hassaan", email = "hassaan@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "byb_common", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
httpx = ">=0.27.0"
pydantic = ">=2.7.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
